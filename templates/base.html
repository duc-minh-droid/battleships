<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Battleships{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/game.css') }}">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><circle cx='32' cy='32' r='30' fill='%230a1a2f'/><path d='M10 38h44l-6 10H16z' fill='%238e9cab'/><rect x='26' y='28' width='12' height='10' fill='%238e9cab'/></svg>">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('placement_interface') }}">
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <circle cx="32" cy="32" r="30" fill="none" stroke="#4fd1ff" stroke-opacity=".5" stroke-width="2"/>
        <circle cx="32" cy="32" r="18" fill="none" stroke="#4fd1ff" stroke-opacity=".25" stroke-width="2"/>
        <path d="M8 38 h48 l-7 9 H15 z" fill="#8e9cab"/>
        <rect x="26" y="28" width="12" height="10" rx="1" fill="#6d7b8a"/>
        <rect x="31" y="20" width="2" height="8" fill="#6d7b8a"/>
        <path d="M14 51 q4 -3 8 0 t8 0 t8 0 t8 0 t8 0" fill="none" stroke="#4fd1ff" stroke-width="2"/>
      </svg>
      <div><h1>BATTLESHIPS</h1><small>Flask &middot; vs AI</small></div>
    </a>
    {% block header %}{% endblock %}
  </header>
  <main>{% block content %}{% endblock %}</main>
  <script src="{{ url_for('static', filename='js/ships.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
